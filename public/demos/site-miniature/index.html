<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lichen’s miniature night sky</title>
    <meta
      name="description"
      content="An original local miniature of Lichen Huang’s website. Miniature-site idea inspired by dimden’s WebTiles example."
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080f1c;
        color: #dce7ed;
        font-family: monospace;
      }
      main {
        width: 250px;
        max-width: 100vw;
        height: min(250px, 100vh);
        display: grid;
        grid-template-rows: 28px minmax(0, 1fr) 36px 36px;
        border: 1px solid #355668;
        overflow: hidden;
        background: #101c2c;
      }
      h1 {
        margin: 0;
        font-size: 10px;
      }
      button {
        font: inherit;
        color: inherit;
        background: #132331;
        border: 1px solid #355668;
        cursor: pointer;
      }
      button:hover {
        background: #243e50;
      }
      button:focus-visible,
      canvas:focus-visible {
        outline: 2px solid #e2b875;
        outline-offset: -3px;
      }
      #home {
        width: 100%;
        height: 28px;
        text-align: left;
        padding: 0 9px;
        color: #9dd1da;
        border-width: 0 0 1px;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        cursor: crosshair;
      }
      nav {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        padding: 3px;
        font-size: 10px;
      }
      nav button[aria-pressed='true'] {
        color: #e2b875;
        border-color: #e2b875;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 5px;
        border-top: 1px solid #355668;
      }
      #weather {
        width: 70px;
        min-height: 28px;
        flex-shrink: 0;
        font-size: 9px;
      }
      #status {
        font-size: 9px;
        line-height: 1.4;
        color: #afcbb6;
      }
    </style>
  </head>
  <body>
    <main aria-label="Interactive miniature website">
      <h1>
        <button
          id="home"
          type="button"
          title="Return to the miniature homepage"
        >
          lichen / after hours ✦
        </button>
      </h1>
      <canvas
        id="sky"
        width="250"
        height="150"
        tabindex="0"
        role="button"
        aria-label="Miniature homepage sky. Click or press Enter to launch a firework."
        >A small night scene. Use the subject buttons to change scenes.</canvas
      >
      <nav aria-label="Miniature subjects">
        <button type="button" data-scene="chemistry" aria-pressed="false">
          Chemistry
        </button>
        <button type="button" data-scene="mathematics" aria-pressed="false">
          Math
        </button>
        <button
          type="button"
          data-scene="computer-science"
          aria-pressed="false"
        >
          CS
        </button>
      </nav>
      <footer>
        <button
          id="weather"
          type="button"
          aria-label="Change miniature weather. Currently clear."
        >
          Sky: clear</button
        ><span id="status" role="status">Home · click the sky</span>
      </footer>
    </main>
    <script src="miniature.js"></script>
  </body>
</html>
