<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">AN EMPTY CELL CAN STILL CHANGE THE LIGHT</text><text x="25" y="63" font-size="13" fill="#9bacbb" text-anchor="start">Schematic reflections between two parallel surfaces</text><rect x="30.0" y="100" width="411.0" height="455" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="455" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="125" font-size="15" fill="#dce7ed" text-anchor="start">More than one optical path</text><rect x="153.3" y="180" width="8" height="305" fill="#0c1521" stroke="#9dd1da" stroke-width="2"/><rect x="317.7" y="180" width="8" height="305" fill="#0c1521" stroke="#9dd1da" stroke-width="2"/><polyline points="50.00,230.00 317.70,230.00 153.30,320.00 317.70,380.00" fill="none" stroke="#e0b582" stroke-width="2"/><rect x="175.60400000000004" y="325.6" width="8" height="8" fill="#dce7ed" stroke="#dce7ed" stroke-width="1"/><text x="235.5" y="519" font-size="12" fill="#9bacbb" text-anchor="middle">the cell itself is part of the optical</text><text x="235.5" y="537" font-size="12" fill="#9bacbb" text-anchor="middle">experiment</text><text x="473.0" y="125" font-size="15" fill="#dce7ed" text-anchor="start">Paths can reinforce or cancel</text><rect x="582.3" y="180" width="8" height="305" fill="#0c1521" stroke="#9dd1da" stroke-width="2"/><rect x="746.7" y="180" width="8" height="305" fill="#0c1521" stroke="#9dd1da" stroke-width="2"/><polyline points="479.00,230.00 746.70,230.00 582.30,320.00 746.70,380.00" fill="none" stroke="#e0b582" stroke-width="2"/><rect x="604.604" y="325.6" width="8" height="8" fill="#dce7ed" stroke="#dce7ed" stroke-width="1"/><text x="664.5" y="519" font-size="12" fill="#9bacbb" text-anchor="middle">the cell itself is part of the optical</text><text x="664.5" y="537" font-size="12" fill="#9bacbb" text-anchor="middle">experiment</text></g></svg>
