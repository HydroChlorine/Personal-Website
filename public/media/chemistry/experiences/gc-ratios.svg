<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">NORMALIZATION CAN HELP / ASSUMPTIONS STILL MATTER</text><text x="25" y="63" font-size="13" fill="#9bacbb" text-anchor="start">Illustrative common injection variation, not a diagnosis of the lab data</text><rect x="30.0" y="100" width="411.0" height="455" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="455" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="125" font-size="15" fill="#dce7ed" text-anchor="start">Two peaks share an injection</text><rect x="75.0" y="418.63611830610904" width="55" height="56.36388169389097" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="220.5" y="441.1816709836654" width="55" height="33.81832901633458" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><text x="235.5" y="519" font-size="12" fill="#9bacbb" text-anchor="middle">common dilution alone does not</text><text x="235.5" y="537" font-size="12" fill="#9bacbb" text-anchor="middle">invalidate a ratio</text><text x="473.0" y="125" font-size="15" fill="#dce7ed" text-anchor="start">A common scale can cancel</text><rect x="504.0" y="418.63611830610904" width="55" height="56.36388169389097" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="649.5" y="441.1816709836654" width="55" height="33.81832901633458" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><text x="664.5" y="170" font-size="16" fill="#dce7ed" text-anchor="middle">A / B = constant</text><text x="664.5" y="519" font-size="12" fill="#9bacbb" text-anchor="middle">common dilution alone does not</text><text x="664.5" y="537" font-size="12" fill="#9bacbb" text-anchor="middle">invalidate a ratio</text></g></svg>
