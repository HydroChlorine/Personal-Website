<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">A SMALL DIFFERENCE BETWEEN LARGE MEASUREMENTS</text><text x="25" y="63" font-size="13" fill="#9bacbb" text-anchor="start">An illustrative uncertainty comparison, not a numerical result</text><rect x="30.0" y="100" width="411.0" height="455" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="455" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="125" font-size="15" fill="#dce7ed" text-anchor="start">The desired difference is small</text><rect x="80.0" y="295" width="55" height="180" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="218.0" y="310" width="55" height="165" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><polyline points="60.00,475.00 411.00,475.00" fill="none" stroke="#3c5667" stroke-width="2"/><text x="235.5" y="519" font-size="12" fill="#9bacbb" text-anchor="middle">common errors need covariance, not</text><text x="235.5" y="537" font-size="12" fill="#9bacbb" text-anchor="middle">duplication</text><text x="473.0" y="125" font-size="15" fill="#dce7ed" text-anchor="start">Shared calibration moves both</text><rect x="509.0" y="304.8228725072869" width="55" height="170.1771274927131" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="647.0" y="319.8228725072869" width="55" height="155.1771274927131" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><polyline points="489.00,475.00 840.00,475.00" fill="none" stroke="#3c5667" stroke-width="2"/><text x="664.5" y="519" font-size="12" fill="#9bacbb" text-anchor="middle">common errors need covariance, not</text><text x="664.5" y="537" font-size="12" fill="#9bacbb" text-anchor="middle">duplication</text></g></svg>
