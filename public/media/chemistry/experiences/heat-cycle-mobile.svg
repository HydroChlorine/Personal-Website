<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1000" viewBox="0 0 450 1000"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">TWO ROUTES TO THE SAME PRODUCTS</text><text x="25" y="63" font-size="12" fill="#9bacbb" text-anchor="start">An energy-cycle illustration, not the</text><text x="25" y="81" font-size="12" fill="#9bacbb" text-anchor="start">reported heat values</text><rect x="25" y="116.0" width="400" height="418.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="546.5" width="400" height="418.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="141.0" font-size="15" fill="#dce7ed" text-anchor="start">Compare the two combustion routes</text><polyline points="60.00,216.00 225.00,444.50 390.00,216.00" fill="none" stroke="#3c5667" stroke-width="2"/><text x="80" y="196.0" font-size="13" fill="#9dd1da" text-anchor="start">monomer</text><text x="370" y="196.0" font-size="13" fill="#e0b582" text-anchor="end">polymer</text><text x="225.0" y="474.5" font-size="13" fill="#9bacbb" text-anchor="middle">common products</text><polyline points="60.00,216.00 225.00,444.50" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="176.8" y="378.52" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="209.79999999999998" y="424.21999999999997" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="77.80000000000001" y="241.42000000000002" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="110.79999999999998" y="287.11999999999995" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="143.8" y="332.82" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><polyline points="390.00,216.00 225.00,444.50" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="269.2" y="378.52" width="4" height="4" fill="#e0b5