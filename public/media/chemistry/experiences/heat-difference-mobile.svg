<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1000" viewBox="0 0 450 1000"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">A SMALL DIFFERENCE BETWEEN LARGE</text><text x="25" y="56" font-size="14" fill="#9dd1da" text-anchor="start">MEASUREMENTS</text><text x="25" y="85" font-size="12" fill="#9bacbb" text-anchor="start">An illustrative uncertainty comparison,</text><text x="25" y="103" font-size="12" fill="#9bacbb" text-anchor="start">not a numerical result</text><rect x="25" y="138.0" width="400" height="407.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="557.5" width="400" height="407.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="163.0" font-size="15" fill="#dce7ed" text-anchor="start">The desired difference is small</text><rect x="75.0" y="285.5" width="55" height="180" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="207.5" y="300.5" width="55" height="165" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><polyline points="55.00,465.50 395.00,465.50" fill="none" stroke="#3c5667" stroke-width="2"/><text x="225.0" y="509.5" font-size="12" fill="#9bacbb" text-anchor="middle">common errors need covariance, not</text><text x="225.0" y="527.5" font-size="12" fill="#9bacbb" text-anchor="middle">duplication</text><text x="39" y="582.5" font-size="15" fill="#dce7ed" text-anchor="start">Shared calibration moves both</text><rect x="75.0" y="714.8228725072869" width="55" height="170.1771274927131" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="207.5" y="729.8228725072869" width="55" height="155.1771274927131" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><polyline points="55.00,885.00 395.00,885.00" fill="none" stroke="#3c5667" stroke-width="2"/><text x="225.0" y="929.0" font-size="12" fill="#9bacbb" text-anchor="middle">common errors need covariance, not</text><text x="225.0" y="947.0" font-size="12" fill="#9bacbb" text-anchor="middle">duplication</text></g></svg>
