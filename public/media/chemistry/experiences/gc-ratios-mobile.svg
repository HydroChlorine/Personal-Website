<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1000" viewBox="0 0 450 1000"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">NORMALIZATION CAN HELP / ASSUMPTIONS</text><text x="25" y="56" font-size="14" fill="#9dd1da" text-anchor="start">STILL MATTER</text><text x="25" y="85" font-size="12" fill="#9bacbb" text-anchor="start">Illustrative common injection variation,</text><text x="25" y="103" font-size="12" fill="#9bacbb" text-anchor="start">not a diagnosis of the lab data</text><rect x="25" y="138.0" width="400" height="407.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="557.5" width="400" height="407.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="163.0" font-size="15" fill="#dce7ed" text-anchor="start">Two peaks share an injection</text><rect x="70.0" y="409.13611830610904" width="55" height="56.36388169389097" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="210.0" y="431.6816709836654" width="55" height="33.81832901633458" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><text x="225.0" y="509.5" font-size="12" fill="#9bacbb" text-anchor="middle">common dilution alone does not</text><text x="225.0" y="527.5" font-size="12" fill="#9bacbb" text-anchor="middle">invalidate a ratio</text><text x="39" y="582.5" font-size="15" fill="#dce7ed" text-anchor="start">A common scale can cancel</text><rect x="70.0" y="828.636118306109" width="55" height="56.36388169389097" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="210.0" y="851.1816709836654" width="55" height="33.81832901633458" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><text x="225.0" y="627.5" font-size="16" fill="#dce7ed" text-anchor="middle">A / B = constant</text><text x="225.0" y="929.0" font-size="12" fill="#9bacbb" text-anchor="middle">common dilution alone does not</text><text x="225.0" y="947.0" font-size="12" fill="#9bacbb" text-anchor="middle">invalidate a ratio</text></g></svg>
