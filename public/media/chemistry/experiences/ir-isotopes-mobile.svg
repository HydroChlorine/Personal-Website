<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1000" viewBox="0 0 450 1000"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">SAME ELEMENTS / DIFFERENT MASSES</text><text x="25" y="63" font-size="12" fill="#9bacbb" text-anchor="start">Harmonic reduced-mass illustration for</text><text x="25" y="81" font-size="12" fill="#9bacbb" text-anchor="start">HCl and DCl</text><rect x="25" y="116.0" width="400" height="418.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="546.5" width="400" height="418.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="141.0" font-size="15" fill="#dce7ed" text-anchor="start">A lighter oscillator</text><polyline points="152.34,296.00 297.66,296.00" fill="none" stroke="#3c5667" stroke-width="4"/><rect x="144.83508111746977" y="288.5" width="15" height="15" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="281.66491888253023" y="280.0" width="32" height="32" fill="#afcbb6" stroke="#afcbb6" stroke-width="1"/><text x="152.33508111746977" y="346.0" font-size="17" fill="#dce7ed" text-anchor="middle">H</text><text x="297.66491888253023" y="346.0" font-size="17" fill="#dce7ed" text-anchor="middle">Cl</text><text x="225.0" y="498.5" font-size="12" fill="#9bacbb" text-anchor="middle">greater reduced mass lowers the ideal</text><text x="225.0" y="516.5" font-size="12" fill="#9bacbb" text-anchor="middle">frequency</text><text x="39" y="571.5" font-size="15" fill="#dce7ed" text-anchor="start">A heavier oscillator</text><polyline points="159.48,726.50 290.52,726.50" fill="none" stroke="#3c5667" stroke-width="4"/><rect x="148.47813170972984" y="715.5" width="22" height="22" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><rect x="274.52186829027016" y="710.5" width="32" height="32" fill="#afcbb6" stroke="#afcbb6" stroke-width="1"/><text x="159.47813170972984" y="776.5" font-size="17" fill="#dce7ed" text-anchor="middle">D</text><text x="290.52186829027016" y="776.5" font-size="17" fill="#dce7ed" text-anchor="middle">Cl</text><text x="225.0" y="929.0" font-size="12" fill="#9bacbb" text-anchor="middle">greater reduced mass lowers the ideal</text><text x="225.0" y="947.0" font-size="12" fill="#9bacbb" text-anchor="middle">frequency</text></g></svg>
