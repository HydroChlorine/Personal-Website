<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1000" viewBox="0 0 450 1000"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">TUNE THE SOURCE / SHARPEN THE PACKET</text><text x="25" y="63" font-size="12" fill="#9bacbb" text-anchor="start">Illustrative spatial focusing, not a</text><text x="25" y="81" font-size="12" fill="#9bacbb" text-anchor="start">measured resolving power</text><rect x="25" y="116.0" width="400" height="418.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="546.5" width="400" height="418.5" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="141.0" font-size="15" fill="#dce7ed" text-anchor="start">A spread of starting positions</text><polyline points="50.00,236.00 400.00,336.00" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="298.0" y="232.0" width="8" height="8" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><polyline points="50.00,301.00 400.00,336.00" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="298.0" y="297.0" width="8" height="8" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><polyline points="50.00,366.00 400.00,336.00" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="298.0" y="362.0" width="8" height="8" fill="#afcbb6" stroke="#afcbb6" stroke-width="1"/><text x="225.0" y="498.5" font-size="12" fill="#9bacbb" text-anchor="middle">schematic; electric fields and</text><text x="225.0" y="516.5" font-size="12" fill="#9bacbb" text-anchor="middle">geometry matter</text><text x="39" y="571.5" font-size="15" fill="#dce7ed" text-anchor="start">Timing spread can be reduced</text><polyline points="50.00,666.50 400.00,766.50" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="298.0" y="734.5" width="8" height="8" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><polyline points="50.00,731.50 400.00,766.50" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="298.0" y="752.7" width="8" height="8" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><polyline points="50.00,796.50 400.00,766.50" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="298.0" y="770.9" width="8" height="8" fill="#afcbb6" stroke="#afcbb6" stroke-width="1"/><text x="225.0" y="929.0" font-size="12" fill="#9bacbb" text-anchor="middle">schematic; electric fields and</text><text x="225.0" y="947.0" font-size="12" fill="#9bacbb" text-anchor="middle">geometry matter</text></g></svg>
