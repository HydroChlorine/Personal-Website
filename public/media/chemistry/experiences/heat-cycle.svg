<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">TWO ROUTES TO THE SAME PRODUCTS</text><text x="25" y="63" font-size="13" fill="#9bacbb" text-anchor="start">An energy-cycle illustration, not the reported heat values</text><rect x="30.0" y="100" width="411.0" height="455" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="455" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="125" font-size="15" fill="#dce7ed" text-anchor="start">Compare the two combustion routes</text><polyline points="65.00,200.00 235.50,465.00 406.00,200.00" fill="none" stroke="#3c5667" stroke-width="2"/><text x="85.0" y="180" font-size="13" fill="#9dd1da" text-anchor="start">monomer</text><text x="386.0" y="180" font-size="13" fill="#e0b582" text-anchor="end">polymer</text><text x="235.5" y="495" font-size="13" fill="#9bacbb" text-anchor="middle">common products</text><polyline points="65.00,200.00 235.50,465.00" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="185.76" y="388.79999999999995" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="219.85999999999999" y="441.79999999999995" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="83.46000000000002" y="229.80000000000004" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="117.55999999999997" y="282.79999999999995" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="151.66" y="335.8" width="4" height="4" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><polyline points="406.00,200.00 235.50,465.00" fill="none" stroke="#3c5667" stroke-width="1"/><rect x="281.24" y="388.79999999999995" width="4" height="4" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><rect x="247.1