<svg xmlns="http://www.w3.org/2000/svg" width="450" height="950" viewBox="0 0 450 950"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">ROOM TO KEEP GROWING</text><text x="25" y="67" font-size="21" fill="#dce7ed" text-anchor="start">One socket can lead to more.</text><rect x="25" y="92" width="400" height="248" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="41" y="121" font-size="18" fill="#9dd1da" text-anchor="start">Extend a branch</text><polyline points="225.00,343.00 225.00,367.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="220.65,358.00 225.00,367.00 229.35,358.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="223.0" y="341.0" width="4" height="4" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><rect x="25" y="370" width="400" height="248" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="41" y="399" font-size="18" fill="#9dd1da" text-anchor="start">Leave more outlets</text><polyline points="225.00,621.00 225.00,645.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="220.65,636.00 225.00,645.00 229.35,636.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="25" y="648" width="400" height="248" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="41" y="677" font-size="18" fill="#9dd1da" text-anchor="start">Let the ends meet</text><text x="160.0" y="223" font-size="27" fill="#9dd1da" text-anchor="middle">C</text><text x="225.0" y="223" font-size="27" fill="#9dd1da" text-anchor="middle">C</text><text x="290.0" y="223" font-size="27" fill="#e0b582" text-anchor="middle">*</text><polyline points="177.00,217.00 208.00,217.00" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="242.00,217.00 273.00,217.00" fill="none" stroke="#9dd1da" stroke-width="2"/><text x="225.0" y="297" font-size="14" fill="#9bacbb" text-anchor="middle">a linker carries</text><text x="225.0" y="318" font-size="14" fill="#9bacbb" text-anchor="middle">the next open site</text><text x="225.0" y="503" font-size="27" fill="#9dd1da" text-anchor="middle">C</text><polyline points="211.25,485.00 183.75,465.00" fill="none" stroke="#9dd1da" stroke-width="2"/><text x="170.0" y="463" font-size="25" fill="#e0b582" text-anchor="middle">*</text><polyline points="238.75,485.00 266.25,465.00" fill="none" stroke="#9dd1da" stroke-width="2"/><text x="280.0" y="463" font-size="25" fill="#e0b582" text-anchor="middle">*</text><polyline points="225.00,508.00 225.00,534.00" fill="none" stroke="#9dd1da" stroke-width="2"/><text x="225.0" y="555" font-size="25" fill="#9dd1da" text-anchor="middle">C</text><text x="225.0" y="595" font-size="14" fill="#9bacbb" text-anchor="middle">more ways to branch</text><polyline points="225.00,821.00 179.35,787.83 196.79,734.17 253.21,734.17 270.65,787.83" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="270.65,787.83 225.00,821.00" fill="none" stroke="#e0b582" stroke-width="2" stroke-dasharray="5 5"/><text x="237.0" y="825.0" font-size="22" fill="#e0b582" text-anchor="start">*</text><text x="282.6507127821674" y="791.8328157299975" font-size="22" fill="#e0b582" text-anchor="start">*</text><text x="225.0" y="853" font-size="14" fill="#9bacbb" text-anchor="middle">nearby open ends</text><text x="225.0" y="874" font-size="14" fill="#9bacbb" text-anchor="middle">can close a ring</text><text x="25" y="925" font-size="13" fill="#e0b582" text-anchor="start">* marks a place to attach another group.</text></g></svg>
