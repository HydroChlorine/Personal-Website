<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="35" y="34" font-size="14" fill="#9dd1da" text-anchor="start">ROOM TO KEEP GROWING</text><text x="35" y="67" font-size="27" fill="#dce7ed" text-anchor="start">One socket can lead to more.</text><rect x="30" y="108" width="250" height="310" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="46" y="137" font-size="18" fill="#9dd1da" text-anchor="start">Extend a branch</text><polyline points="285.00,263.00 320.00,263.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="311.00,267.35 320.00,263.00 311.00,258.65" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="283.0" y="261.0" width="4" height="4" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><rect x="325" y="108" width="250" height="310" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="341" y="137" font-size="18" fill="#9dd1da" text-anchor="start">Leave more outlets</text><polyline points="580.00,263.00 615.00,263.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="606.00,267.35 615.00,263.00 606.00,258.65" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="620" y="108" width="250" height="310" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="636" y="137" font-size="18" fill="#9dd1da" text-anchor="start">Let the ends meet</text><text x="90.0" y="239" font-size="27" fill="#9dd1da" text-anchor="middle">C</text><text x="155.0" y="239" font-size="27" fill="#9dd1da" text-anchor="middle">C</text><text x="220.0" y="239" font-size="27" fill="#e0b582" text-anchor="middle">*</text><polyline points="107.00,233.00 138.00,233.00" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="172.00,233.00 203.00,233.00" fill="none" stroke="#9dd1da" stroke-width="2"/><text x="155.0" y="375" font-size="14" fill="#9bacbb" text-anchor="middle">a linker carries</text><text x="1