<svg xmlns="http://www.w3.org/2000/svg" width="450" height="950" viewBox="0 0 450 950"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">FROM CONNECTIONS TO COORDINATES</text><text x="25" y="67" font-size="21" fill="#dce7ed" text-anchor="start">Give the drawing some shape.</text><rect x="25" y="92" width="400" height="248" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="41" y="121" font-size="18" fill="#9dd1da" text-anchor="start">A flat drawing</text><polyline points="225.00,343.00 225.00,367.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="220.65,358.00 225.00,367.00 229.35,358.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="223.0" y="341.0" width="4" height="4" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><rect x="25" y="370" width="400" height="248" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="41" y="399" font-size="18" fill="#9dd1da" text-anchor="start">A starting 3D pose</text><polyline points="225.00,621.00 225.00,645.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="220.65,636.00 225.00,645.00 229.35,636.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="25" y="648" width="400" height="248" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="41" y="677" font-size="18" fill="#9dd1da" text-anchor="start">An input to calculate</text><polyline points="203.00,258.00 171.82,240.00 171.82,204.00 203.00,186.00 234.18,204.00 234.18,240.00 203.00,258.00" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="203.00,247.92 180.55,234.96" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="180.55,209.04 203.00,196.08" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="225.45,209.04 225.45,234.96" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="234.00,204.00 263.00,190.00 290.00,212.00" fill="none" stroke="#9dd1da" stroke-width="2"/><text x="225.0" y="297" font-size="14" fill="#9bacbb" text-anchor="middle">which atoms</text><text x="225.0" y="318" font-size="14" fill="#9bacbb" text-anchor="middle">are connected?</text><polyline points="167.50,490.00 197.00,460.00" fill="none" stroke="#3c5667" stroke-width="3"/><polyline points="197.00,460.00 242.00,476.00" fill="none" stroke="#3c5667" stroke-width="3"/><polyline points="242.00,476.00 285.00,512.00" fill="none" stroke="#3c5667" stroke-width="3"/><polyline points="285.00,512.00 253.25,541.00" fill="none" stroke="#3c5667" stroke-width="3"/><polyline points="253.25,541.00 209.25,525.00" fill="none" stroke="#3c5667" stroke-width="3"/><polyline points="209.25,525.00 167.50,490.00" fill="none" stroke="#3c5667" stroke-width="3"/><polyline points="197.00,460.00 225.00,500.00" fill="none" stroke="#3c5667" stroke-width="3"/><polyline points="253.25,541.00 225.00,500.00" fill="none" stroke="#3c5667" stroke-width="3"/><rect x="162.5" y="485" width="10" height="10" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="192.0" y="455" width="10" height="10" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="237.0" y="471" width="10" height="10" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="280.0" y="507" width="10" height="10" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="248.25" y="536" width="10" height="10" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="204.25" y="520" width="10" height="10" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><rect x="220.0" y="495" width="10" height="10" fill="#e0b582" stroke="#9dd1da" stroke-width="1"/><text x="225.0" y="575" font-size="14" fill="#9bacbb" text-anchor="middle">where might</text><text x="225.0" y="596" font-size="14" fill="#9bacbb" text-anchor="middle">they sit?</text><rect x="163.0" y="723" width="124" height="111" fill="#0c1521" stroke="#3c5667" stroke-width="1"/><text x="178.0" y="755" font-size="16" fill="#9dd1da" text-anchor="start">atoms</text><text x="178.0" y="784" font-size="16" fill="#9dd1da" text-anchor="start">x / y / z</text><text x="178.0" y="813" font-size="16" fill="#e0b582" text-anchor="start">settings</text><rect x="268.0" y="738.0" width="4" height="4" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><text x="225.0" y="853" font-size="14" fill="#9bacbb" text-anchor="middle">hand it over</text><text x="225.0" y="874" font-size="14" fill="#9bacbb" text-anchor="middle">to Gaussian</text><text x="25" y="925" font-size="12" fill="#9bacbb" text-anchor="start">Shape first. Then calculate and check.</text></g></svg>
