<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">FROM EXAMPLES TO A STATEMENT</text><text x="25" y="62" font-size="13" fill="#9bacbb" text-anchor="start">Testing and proof answer complementary questions</text><rect x="30.0" y="100" width="411.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Try particular cases</text><text x="47.0" y="200" font-size="18" fill="#dce7ed" text-anchor="start">insert into empty</text><text x="47.0" y="255" font-size="18" fill="#dce7ed" text-anchor="start">replace an entry</text><text x="47.0" y="310" font-size="18" fill="#dce7ed" text-anchor="start">insert near an edge</text><rect x="412.0" y="306.0" width="8" height="8" fill="#afcbb6" stroke="#afcbb6" stroke-width="1"/><text x="473.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">State the general property</text><text x="476.0" y="200" font-size="18" fill="#9dd1da" text-anchor="start">For every valid tree t</text><text x="476.0" y="238" font-size="18" fill="#9dd1da" text-anchor="start">insertion preserves</text><text x="476.0" y="276" font-size="18" fill="#9dd1da" text-anchor="start">the ordering invariant</text><text x="44.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">useful examples and regressions</text><text x="473.0" y="514" font-size="12" fill="#e0b582" text-anchor="start">proof requires definitions and</text><text x="473.0" y="530" font-size="12" fill="#e0b582" text-anchor="start">premises</text></g></svg>
