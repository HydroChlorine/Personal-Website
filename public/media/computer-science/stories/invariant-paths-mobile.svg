<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1000" viewBox="0 0 450 1000"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">COLORS CONSTRAIN EVERY PATH</text><text x="25" y="62" font-size="12" fill="#9bacbb" text-anchor="start">Dark nodes are black; coral nodes are</text><text x="25" y="78" font-size="12" fill="#9bacbb" text-anchor="start">red</text><rect x="25" y="94.0" width="400" height="425.0" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="531.0" width="400" height="425.0" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="120.0" font-size="16" fill="#dce7ed" text-anchor="start">Follow a root-to-empty path</text><polyline points="225.00,204.00 133.00,303.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="225.00,204.00 317.00,303.00" fill="none" stroke="#e0b582" stroke-width="2"/><polyline points="133.00,339.00 87.00,438.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="133.00,339.00 179.00,438.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="69.0" y="438.0" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="87.0" y="462.0" font-size="18" fill="#dce7ed" text-anchor="middle">2</text><rect x="161.0" y="438.0" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="179.0" y="462.0" font-size="18" fill="#dce7ed" text-anchor="middle">6</text><rect x="115.0" y="303.0" width="36" height="36" fill="#ce8c86" stroke="#afcbb6" stroke-width="2"/><text x="133.0" y="327.0" font-size="18" fill="#0c1521" text-anchor="middle">4</text><polyline points="317.00,339.00 271.00,438.00" fill="none" stroke="#e0b582" stroke-width="2"/><polyline points="317.00,339.00 363.00,438.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="253.0" y="438.0" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="271.0" y="462.0" font-size="18" fill="#dce7ed" text-anchor="middle">10</text><rect x="345.0" y="438.0" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="363.0" y="462.0" font-size="18" fill="#dce7ed" text-anchor="middle">14</text><rect x="299.0" y="303.0" width="36" height="36" fill="#ce8c86" stroke="#e0b582" stroke-width="2"/><text x="317.0" y="327.0" font-size="18" fill="#0c1521" text-anchor="middle">12</text><rect x="207.0" y="168.0" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="225.0" y="192.0" font-size="18" fill="#dce7ed" text-anchor="middle">8</text><text x="39" y="501.0" font-size="12" fill="#e0b582" text-anchor="start">empty leaves are implicit</text><text x="39" y="557.0" font-size="16" fill="#dce7ed" text-anchor="start">Two constraints together</text><text x="42" y="626.0" font-size="18" fill="#9dd1da" text-anchor="start">No adjacent red nodes</text><text x="42" y="666.0" font-size="18" fill="#9dd1da" text-anchor="start">Same black count</text><text x="42" y="706.0" font-size="18" fill="#9dd1da" text-anchor="start">on every path</text><text x="42" y="746.0" font-size="18" fill="#9dd1da" text-anchor="start">Highlighted count: 2</text><text x="39" y="938.0" font-size="12" fill="#e0b582" text-anchor="start">count excludes the empty leaf</text></g></svg>
