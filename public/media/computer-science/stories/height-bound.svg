#0c1521" stroke="#e0b582" stroke-width="2"/><text x="330.03" y="293.0" font-size="18" fill="#dce7ed" text-anchor="middle">12</text><rect x="217.5" y="174" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="235.5" y="198" font-size="18" fill="#dce7ed" text-anchor="middle">8</text><text x="44.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">height counts nonempty nodes</text><text x="473.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Compare the lengths</text><text x="479.0" y="190" font-size="17" fill="#9dd1da" text-anchor="start">height</text><rect x="479.0" y="208" width="272.8" height="20" fill="#9dd1da" stroke="#9dd1da" stroke-width="1"/><text x="848.0" y="224" font-size="18" fill="#9dd1da" text-anchor="end">4</text><text x="479.0" y="285" font-size="17" fill="#afcbb6" text-anchor="start">minimum depth</text><rect x="479.0" y="303" width="136.4" height="20" fill="#afcbb6" stroke="#afcbb6" stroke-width="1"/><text x="848.0" y="319" font-size="18" fill="#afcbb6" text-anchor="end">2</text><text x="479.0" y="380" font-size="17" fill="#e0b582" text-anchor="start">2 * min + 1</text><rect x="479.0" y="398" width="341.0" height="20" fill="#e0b582" stroke="#e0b582" stroke-width="1"/><text x="848.0" y="414" font-size="18" fill="#e0b582" text-anchor="end">5</text><text x="473.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">4 &lt;= 5 in this constructed example</text></g></svg>
