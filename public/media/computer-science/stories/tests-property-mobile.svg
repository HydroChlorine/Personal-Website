<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1000" viewBox="0 0 450 1000"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">FROM EXAMPLES TO A STATEMENT</text><text x="25" y="62" font-size="12" fill="#9bacbb" text-anchor="start">Testing and proof answer complementary</text><text x="25" y="78" font-size="12" fill="#9bacbb" text-anchor="start">questions</text><rect x="25" y="94.0" width="400" height="425.0" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="531.0" width="400" height="425.0" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="120.0" font-size="16" fill="#dce7ed" text-anchor="start">Try particular cases</text><text x="42" y="194.0" font-size="18" fill="#dce7ed" text-anchor="start">insert into empty</text><text x="42" y="249.0" font-size="18" fill="#dce7ed" text-anchor="start">replace an entry</text><text x="42" y="304.0" font-size="18" fill="#dce7ed" text-anchor="start">insert near an edge</text><rect x="396.0" y="300.0" width="8" height="8" fill="#afcbb6" stroke="#afcbb6" stroke-width="1"/><text x="39" y="557.0" font-size="16" fill="#dce7ed" text-anchor="start">State the general property</text><text x="42" y="631.0" font-size="18" fill="#9dd1da" text-anchor="start">For every valid tree t</text><text x="42" y="669.0" font-size="18" fill="#9dd1da" text-anchor="start">insertion preserves</text><text x="42" y="707.0" font-size="18" fill="#9dd1da" text-anchor="start">the ordering invariant</text><text x="39" y="501.0" font-size="12" fill="#e0b582" text-anchor="start">useful examples and regressions</text><text x="39" y="930.0" font-size="12" fill="#e0b582" text-anchor="start">proof requires definitions and</text><text x="39" y="946.0" font-size="12" fill="#e0b582" text-anchor="start">premises</text></g></svg>
