<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">PROPOSITIONS AS TYPES / PROOFS AS TERMS</text><text x="25" y="62" font-size="13" fill="#9bacbb" text-anchor="start">Function composition is one small constructive example</text><rect x="30.0" y="100" width="268.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="316.0" y="100" width="268.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="602.0" y="100" width="268.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Assumptions</text><text x="47.0" y="195" font-size="18" fill="#afcbb6" text-anchor="start">a proof of A</text><text x="47.0" y="239" font-size="18" fill="#afcbb6" text-anchor="start">a function A -&gt; B</text><text x="47.0" y="283" font-size="18" fill="#afcbb6" text-anchor="start">a function B -&gt; C</text><rect x="81.0" y="422.0" width="32" height="36" fill="#132331" stroke="#e0b582" stroke-width="2"/><text x="97.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">A</text><rect x="148.0" y="422.0" width="32" height="36" fill="#132331" stroke="#9dd1da" stroke-width="2"/><text x="164.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">B</text><rect x="215.0" y="422.0" width="32" height="36" fill="#132331" stroke="#afcbb6" stroke-width="2"/><text x="231.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">C</text><text x="44.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">proofs of implications</text><text x="330.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Compose</text><text x="333.0" y="195" font-size="18" fill="#afcbb6" text-anchor="start">apply A -&gt; B</text><text x="333.0" y="239" font-size="18" fill="#afcbb6" text-anchor="start">obtain a proof of B</text><text x="333.0" y="283" font-size="18" fill="#afcbb6" text-anchor="start">apply B -&gt; C</text><rect x="367.0" y="422.0" width="32" height="36" fill="#132331" stroke="#e0b582" stroke-width="2"/><text x="383.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">A</text><rect x="434.0" y="422.0" width="32" height="36" fill="#132331" stroke="#9dd1da" stroke-width="2"/><text x="450.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">B</text><rect x="501.0" y="422.0" width="32" height="36" fill="#132331" stroke="#afcbb6" stroke-width="2"/><text x="517.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">C</text><text x="330.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">typed application</text><text x="616.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Check the result</text><text x="619.0" y="195" font-size="18" fill="#afcbb6" text-anchor="start">a term of type C</text><text x="619.0" y="239" font-size="18" fill="#afcbb6" text-anchor="start">a composed function</text><text x="619.0" y="283" font-size="18" fill="#afcbb6" text-anchor="start">A -&gt; C</text><rect x="653.0" y="422.0" width="32" height="36" fill="#132331" stroke="#e0b582" stroke-width="2"/><text x="669.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">A</text><rect x="720.0" y="422.0" width="32" height="36" fill="#132331" stroke="#9dd1da" stroke-width="2"/><text x="736.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">B</text><rect x="787.0" y="422.0" width="32" height="36" fill="#132331" stroke="#afcbb6" stroke-width="2"/><text x="803.0" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">C</text><text x="616.0" y="514" font-size="12" fill="#e0b582" text-anchor="start">relative to the</text><text x="616.0" y="530" font-size="12" fill="#e0b582" text-anchor="start">assumptions</text></g></svg>
