<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">COLORS CONSTRAIN EVERY PATH</text><text x="25" y="62" font-size="13" fill="#9bacbb" text-anchor="start">Dark nodes are black; coral nodes are red</text><rect x="30.0" y="100" width="411.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Follow a root-to-empty path</text><polyline points="235.50,210.00 140.97,316.50" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="235.50,210.00 330.03,316.50" fill="none" stroke="#e0b582" stroke-width="2"/><polyline points="140.97,352.50 93.70,459.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="140.97,352.50 188.24,459.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="75.705" y="459.0" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="93.705" y="483.0" font-size="18" fill="#dce7ed" text-anchor="middle">2</text><rect x="170.235" y="459.0" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="188.235" y="483.0" font-size="18" fill="#dce7ed" text-anchor="middle">6</text><rect x="122.97" y="316.5" width="36" height="36" fill="#ce8c86" stroke="#afcbb6" stroke-width="2"/><text x="140.97" y="340.5" font-size="18" fill="#0c1521" text-anchor="middle">4</text><polyline points="330.03,352.50 282.76,459.00" fill="none" stroke="#e0b582" stroke-width="2"/><polyline points="330.03,352.50 377.29,459.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="264.765" y="459.0" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="282.765" y="483.0" font-size="18" fill="#dce7ed" text-anchor="middle">10</text><rect x="359.29499999999996" y="459.0" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="377.29499999999996" y="483.0" font-size="18" fill="#dce7ed" text-anchor="middle">14</text><rect x="312.03" y="316.5" width="36" height="36" fill="#ce8c86" stroke="#e0b582" stroke-width="2"/><text x="330.03" y="340.5" font-size="18" fill="#0c1521" text-anchor="middle">12</text><rect x="217.5" y="174" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="235.5" y="198" font-size="18" fill="#dce7ed" text-anchor="middle">8</text><text x="44.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">empty leaves are implicit</text><text x="473.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Two constraints together</text><text x="476.0" y="195" font-size="18" fill="#9dd1da" text-anchor="start">No adjacent red nodes</text><text x="476.0" y="235" font-size="18" fill="#9dd1da" text-anchor="start">Same black count</text><text x="476.0" y="275" font-size="18" fill="#9dd1da" text-anchor="start">on every path</text><text x="476.0" y="315" font-size="18" fill="#9dd1da" text-anchor="start">Highlighted count: 2</text><text x="473.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">count excludes the empty leaf</text></g></svg>
