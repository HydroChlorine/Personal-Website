<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1000" viewBox="0 0 450 1000"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">CHANGE THE SHAPE / KEEP THE MEANING</text><text x="25" y="62" font-size="12" fill="#9bacbb" text-anchor="start">An original three-key instance of the</text><text x="25" y="78" font-size="12" fill="#9bacbb" text-anchor="start">balance idea</text><rect x="25" y="94.0" width="400" height="425.0" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="531.0" width="400" height="425.0" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="120.0" font-size="16" fill="#dce7ed" text-anchor="start">A temporary red-red chain</text><polyline points="225.00,204.00 133.00,303.00" fill="none" stroke="#e0b582" stroke-width="2"/><polyline points="133.00,339.00 87.00,438.00" fill="none" stroke="#e0b582" stroke-width="2"/><rect x="69.0" y="438.0" width="36" height="36" fill="#ce8c86" stroke="#e0b582" stroke-width="2"/><text x="87.0" y="462.0" font-size="18" fill="#0c1521" text-anchor="middle">10</text><rect x="115.0" y="303.0" width="36" height="36" fill="#ce8c86" stroke="#e0b582" stroke-width="2"/><text x="133.0" y="327.0" font-size="18" fill="#0c1521" text-anchor="middle">20</text><rect x="207.0" y="168.0" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="225.0" y="192.0" font-size="18" fill="#dce7ed" text-anchor="middle">30</text><text x="39" y="501.0" font-size="12" fill="#e0b582" text-anchor="start">in-order keys: 10, 20, 30</text><text x="39" y="557.0" font-size="16" fill="#dce7ed" text-anchor="start">Blacken the root</text><polyline points="225.00,641.00 133.00,740.00" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="225.00,641.00 317.00,740.00" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="115.0" y="740.0" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="133.0" y="764.0" font-size="18" fill="#dce7ed" text-anchor="middle">10</text><rect x="299.0" y="740.0" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="317.0" y="764.0" font-size="18" fill="#dce7ed" text-anchor="middle">30</text><rect x="207.0" y="605.0" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="225.0" y="629.0" font-size="18" fill="#dce7ed" text-anchor="middle">20</text><text x="39" y="938.0" font-size="12" fill="#e0b582" text-anchor="start">the same keys, the same order</text></g></svg>
