<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1300" viewBox="0 0 450 1300"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">PROPOSITIONS AS TYPES / PROOFS AS TERMS</text><text x="25" y="62" font-size="12" fill="#9bacbb" text-anchor="start">Function composition is one small</text><text x="25" y="78" font-size="12" fill="#9bacbb" text-anchor="start">constructive example</text><rect x="25" y="94.0" width="400" height="383.3333333333333" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="489.3333333333333" width="400" height="383.3333333333333" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="884.6666666666666" width="400" height="383.3333333333333" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="120.0" font-size="16" fill="#dce7ed" text-anchor="start">Assumptions</text><text x="42" y="189.0" font-size="18" fill="#afcbb6" text-anchor="start">a proof of A</text><text x="42" y="233.0" font-size="18" fill="#afcbb6" text-anchor="start">a function A -&gt; B</text><text x="42" y="277.0" font-size="18" fill="#afcbb6" text-anchor="start">a function B -&gt; C</text><rect x="109.0" y="359.3333333333333" width="32" height="36" fill="#132331" stroke="#e0b582" stroke-width="2"/><text x="125.0" y="383.3333333333333" font-size="17" fill="#dce7ed" text-anchor="middle">A</text><rect x="209.0" y="359.3333333333333" width="32" height="36" fill="#132331" stroke="#9dd1da" stroke-width="2"/><text x="225.0" y="383.3333333333333" font-size="17" fill="#dce7ed" text-anchor="middle">B</text><rect x="309.0" y="359.3333333333333" width="32" height="36" fill="#132331" stroke="#afcbb6" stroke-width="2"/><text x="325.0" y="383.3333333333333" font-size="17" fill="#dce7ed" text-anchor="middle">C</text><text x="39" y="459.3333333333333" font-size="12" fill="#e0b582" text-anchor="start">proofs of implications</text><text x="39" y="515.3333333333333" font-size="16" fill="#dce7ed" text-anchor="start">Compose</text><text x="42" y="584.3333333333333" font-size="18" fill="#afcbb6" text-anchor="start">apply A -&gt; B</text><text x="42" y="628.3333333333333" font-size="18" fill="#afcbb6" text-anchor="start">obtain a proof of B</text><text x="42" y="672.3333333333333" font-size="18" fill="#afcbb6" text-anchor="start">apply B -&gt; C</text><rect x="109.0" y="754.6666666666666" width="32" height="36" fill="#132331" stroke="#e0b582" stroke-width="2"/><text x="125.0" y="778.6666666666666" font-size="17" fill="#dce7ed" text-anchor="middle">A</text><rect x="209.0" y="754.6666666666666" width="32" height="36" fill="#132331" stroke="#9dd1da" stroke-width="2"/><text x="225.0" y="778.6666666666666" font-size="17" fill="#dce7ed" text-anchor="middle">B</text><rect x="309.0" y="754.6666666666666" width="32" height="36" fill="#132331" stroke="#afcbb6" stroke-width="2"/><text x="325.0" y="778.6666666666666" font-size="17" fill="#dce7ed" text-anchor="middle">C</text><text x="39" y="854.6666666666666" font-size="12" fill="#e0b582" text-anchor="start">typed application</text><text x="39" y="910.6666666666666" font-size="16" fill="#dce7ed" text-anchor="start">Check the result</text><text x="42" y="979.6666666666666" font-size="18" fill="#afcbb6" text-anchor="start">a term of type C</text><text x="42" y="1023.6666666666666" font-size="18" fill="#afcbb6" text-anchor="start">a composed function</text><text x="42" y="1067.6666666666665" font-size="18" fill="#afcbb6" text-anchor="start">A -&gt; C</text><rect x="109.0" y="1150.0" width="32" height="36" fill="#132331" stroke="#e0b582" stroke-width="2"/><text x="125.0" y="1174.0" font-size="17" fill="#dce7ed" text-anchor="middle">A</text><rect x="209.0" y="1150.0" width="32" height="36" fill="#132331" stroke="#9dd1da" stroke-width="2"/><text x="225.0" y="1174.0" font-size="17" fill="#dce7ed" text-anchor="middle">B</text><rect x="309.0" y="1150.0" width="32" height="36" fill="#132331" stroke="#afcbb6" stroke-width="2"/><text x="325.0" y="1174.0" font-size="17" fill="#dce7ed" text-anchor="middle">C</text><text x="39" y="1250.0" font-size="12" fill="#e0b582" text-anchor="start">relative to the assumptions</text></g></svg>
