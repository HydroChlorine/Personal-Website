<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">FROM A RULE TO A TREE</text><text x="25" y="62" font-size="13" fill="#9bacbb" text-anchor="start">A natural-language sketch, not source code</text><rect x="30.0" y="100" width="411.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">A behavior we can describe</text><text x="47.0" y="200" font-size="18" fill="#9dd1da" text-anchor="start">IF food is ahead</text><text x="47.0" y="255" font-size="18" fill="#9dd1da" text-anchor="start">THEN eat</text><rect x="175.5" y="422.0" width="120" height="36" fill="#132331" stroke="#e0b582" stroke-width="2"/><text x="235.5" y="446" font-size="17" fill="#dce7ed" text-anchor="middle">tokens</text><text x="44.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">assigned grammar / our implementation</text><text x="473.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Structure makes meaning</text><polyline points="664.50,218.00 574.08,282.00" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="578.92,273.25 574.08,282.00 583.94,280.35" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="664.50,218.00 754.92,282.00" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="745.06,280.35 754.92,282.00 750.08,273.25" fill="none" stroke="#9dd1da" stroke-width="2"/><rect x="619.5" y="182.0" width="90" height="36" fill="#132331" stroke="#9dd1da" stroke-width="2"/><text x="664.5" y="206" font-size="17" fill="#dce7ed" text-anchor="middle">Rule</text><rect x="519.08" y="282.0" width="110" height="36" fill="#132331" stroke="#afcbb6" stroke-width="2"/><text x="574.08"