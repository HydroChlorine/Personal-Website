<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">CHANGE THE SHAPE / KEEP THE MEANING</text><text x="25" y="62" font-size="13" fill="#9bacbb" text-anchor="start">An original three-key instance of the balance idea</text><rect x="30.0" y="100" width="411.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="440" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">A temporary red-red chain</text><polyline points="235.50,210.00 140.97,316.50" fill="none" stroke="#e0b582" stroke-width="2"/><polyline points="140.97,352.50 93.70,459.00" fill="none" stroke="#e0b582" stroke-width="2"/><rect x="75.705" y="459.0" width="36" height="36" fill="#ce8c86" stroke="#e0b582" stroke-width="2"/><text x="93.705" y="483.0" font-size="18" fill="#0c1521" text-anchor="middle">10</text><rect x="122.97" y="316.5" width="36" height="36" fill="#ce8c86" stroke="#e0b582" stroke-width="2"/><text x="140.97" y="340.5" font-size="18" fill="#0c1521" text-anchor="middle">20</text><rect x="217.5" y="174" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="235.5" y="198" font-size="18" fill="#dce7ed" text-anchor="middle">30</text><text x="44.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">in-order keys: 10, 20, 30</text><text x="473.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Blacken the root</text><polyline points="664.50,210.00 569.97,316.50" fill="none" stroke="#3c5667" stroke-width="2"/><polyline points="664.50,210.00 759.03,316.50" fill="none" stroke="#3c5667" stroke-width="2"/><rect x="551.97" y="316.5" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="569.97" y="340.5" font-size="18" fill="#dce7ed" text-anchor="middle">10</text><rect x="741.03" y="316.5" width="36" height="36" fill="#0c1521" stroke="#afcbb6" stroke-width="2"/><text x="759.03" y="340.5" font-size="18" fill="#dce7ed" text-anchor="middle">30</text><rect x="646.5" y="174" width="36" height="36" fill="#0c1521" stroke="#e0b582" stroke-width="2"/><text x="664.5" y="198" font-size="18" fill="#dce7ed" text-anchor="middle">20</text><text x="473.0" y="522" font-size="12" fill="#e0b582" text-anchor="start">the same keys, the same order</text></g></svg>
