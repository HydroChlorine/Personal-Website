<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="18" fill="#9dd1da" text-anchor="start">A RULE CONNECTING STATES TO OUTCOMES</text><text x="25" y="62" font-size="13" fill="#9bacbb" text-anchor="start">A normalized two-state example</text><rect x="30.0" y="100" width="411.0" height="360" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="459.0" y="100" width="411.0" height="360" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="44.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Prepared amplitudes</text><polyline points="70.00,195.00 287.69,195.00" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="278.69,199.35 287.69,195.00 278.69,190.65" fill="none" stroke="#9dd1da" stroke-width="2"/><text x="60.0" y="175" font-size="15" fill="#dce7ed" text-anchor="start">c0=0.66</text><polyline points="70.00,285.00 319.34,285.00" fill="none" stroke="#e0b582" stroke-width="2"/><polyline points="310.34,289.35 319.34,285.00 310.34,280.65" fill="none" stroke="#e0b582" stroke-width="2"/><text x="60.0" y="265" font-size="15" fill="#dce7ed" text-anchor="start">c1=0.75</text><text x="473.0" y="126" font-size="16" fill="#dce7ed" text-anchor="start">Outcome probabilities</text><rect x="484.0" y="185" width="156.14865776974253" height="24" fill="#9dd1da" stroke="#3c5667" stroke-width="1"/><text x="484.0" y="233" font-size="14" fill="#dce7ed" text-anchor="start">p0=|c0|^2=0.43</text><rect x="484.0" y="275" width="204.8513422302575" height="24" fill="#e0b582" stroke="#3c5667" stroke-width="1"/><text x="484.0" y="323" font-size="14" fill="#dce7ed" text-anchor="start">p1=|c1|^2=0.57</text><text x="484.0" y="442" font-size="15" fill="#afcbb6" text-anchor="start">p0 + p1 = 1</text></g></svg>
