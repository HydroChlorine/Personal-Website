<svg xmlns="http://www.w3.org/2000/svg" width="450" height="800" viewBox="0 0 450 800"><rect width="100%" height="100%" fill="#0c1521"/><g font-family="ui-monospace, monospace"><text x="25" y="34" font-size="14" fill="#9dd1da" text-anchor="start">A RULE CONNECTING STATES TO OUTCOMES</text><text x="25" y="62" font-size="12" fill="#9bacbb" text-anchor="start">A normalized two-state example</text><rect x="25" y="94.0" width="400" height="325.0" fill="#132331" stroke="#3c5667" stroke-width="1"/><rect x="25" y="431.0" width="400" height="325.0" fill="#132331" stroke="#3c5667" stroke-width="1"/><text x="39" y="120.0" font-size="16" fill="#dce7ed" text-anchor="start">Prepared amplitudes</text><polyline points="65.00,189.00 275.46,189.00" fill="none" stroke="#9dd1da" stroke-width="2"/><polyline points="266.45,193.35 275.46,189.00 266.45,184.65" fill="none" stroke="#9dd1da" stroke-width="2"/><text x="55" y="169.0" font-size="15" fill="#dce7ed" text-anchor="start">c0=0.66</text><polyline points="65.00,279.00 306.05,279.00" fill="none" stroke="#e0b582" stroke-width="2"/><polyline points="297.05,283.35 306.05,279.00 297.05,274.65" fill="none" stroke="#e0b582" stroke-width="2"/><text x="55" y="259.0" font-size="15" fill="#dce7ed" text-anchor="start">c1=0.75</text><text x="39" y="457.0" font-size="16" fill="#dce7ed" text-anchor="start">Outcome probabilities</text><rect x="50" y="516.0" width="151.39066542772824" height="24" fill="#9dd1da" stroke="#3c5667" stroke-width="1"/><text x="50" y="564.0" font-size="14" fill="#dce7ed" text-anchor="start">p0=|c0|^2=0.43</text><rect x="50" y="606.0" width="198.6093345722718" height="24" fill="#e0b582" stroke="#3c5667" stroke-width="1"/><text x="50" y="654.0" font-size="14" fill="#dce7ed" text-anchor="start">p1=|c1|^2=0.57</text><text x="50" y="738.0" font-size="15" fill="#afcbb6" text-anchor="start">p0 + p1 = 1</text></g></svg>
